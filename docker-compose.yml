name: gantrix
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gantrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gantrix}
      POSTGRES_DB: gantrix
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"] # PG 18 images keep data under /var/lib/postgresql/18
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gantrix", "-d", "gantrix"]
      interval: 2s
      retries: 30
  valkey:
    image: valkey/valkey:9-alpine # BSD-3; BullMQ 6.7 verified against 9.1.3
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"] # BullMQ requires noeviction
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["valkeydata:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30
volumes:
  pgdata: {}
  valkeydata: {}
