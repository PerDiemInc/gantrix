# Create the Gantrix Slack app from this manifest. The dashboard's "Connect Slack" page opens
# Slack with it filled in; by hand: https://api.slack.com/apps -> Create New App -> From a
# manifest -> paste this file. Slack's guide:
# https://docs.slack.dev/app-manifests/configuring-apps-with-app-manifests/
display_information:
  name: Gantrix
  description: Posts project progress from your Gantrix agents; reply in the thread to steer them.
  background_color: "#1d1a33"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Gantrix
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write # post progress and replies
      - app_mentions:read # "@Gantrix status", questions, commands
      - im:history # direct messages to the app or to an agent
      - im:read
      - channels:history # replies in a project's thread (public channel)
      - groups:history # the same in a private channel
      - reactions:write # 👀 / ✅ on replies it handled
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im # chat with an agent in a direct message
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  # Socket Mode: Slack sends events over a connection Gantrix opens, so no public URL is needed.
  socket_mode_enabled: true
  token_rotation_enabled: false
